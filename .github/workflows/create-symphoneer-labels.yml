name: Create Symphoneer labels

on:
  push:
    paths:
      - .github/workflows/create-symphoneer-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create or update eligibility labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          create_or_update() {
            local name="$1" color="$2" description="$3"
            if gh api "repos/$GH_REPO/labels/$name" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/labels/$name" \
                -f new_name="$name" -f color="$color" -f description="$description" >/dev/null
            else
              gh api --method POST "repos/$GH_REPO/labels" \
                -f name="$name" -f color="$color" -f description="$description" >/dev/null
            fi
          }
          create_or_update 'symphoneer:ready' '0e8a16' 'Eligible for Symphoneer execution'
          create_or_update 'symphoneer:review' 'fbca04' 'Awaiting human review; excluded from new execution'
